<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>주문 완료 | LEQI</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
  <header id="site-header"></header>

  <main class="container" id="main"></main>

  <footer id="site-footer"></footer>

  <script src="assets/js/data.js"></script>
  <script src="assets/js/store.js"></script>
  <script>
    const order = storage.get('leqi_last_order', null);
    const PAY_LABEL = { card: '신용/체크카드', kakaopay: '카카오페이', naverpay: '네이버페이', tosspay: '토스페이', bank: '무통장입금', vbank: '가상계좌' };

    if (!order) {
      $('#main').innerHTML = `<div class="empty"><p>최근 주문 내역이 없습니다.</p><a href="index.html" class="btn btn-dark">홈으로</a></div>`;
    } else {
      const s = order.shipping;
      $('#main').innerHTML = `
        <div class="complete">
          <div class="complete-icon"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M5 12l5 5 9-10"/></svg></div>
          <h1>주문이 완료되었습니다</h1>
          <p class="order-no">주문번호 <strong>${escapeHtml(order.orderNo)}</strong></p>

          ${order.pay === 'bank' ? `<div class="complete-box"><h2>입금 안내</h2>
            <p>${SHOP.bank}</p><p>입금 금액: <strong>${won(order.total)}</strong></p>
            <p style="font-size:13px;color:var(--text-sub)">주문 후 24시간 이내 미입금 시 자동 취소됩니다.</p></div>` : ''}

          <div class="complete-box">
            <h2>주문 상품</h2>
            ${order.lines.map((l) => `<div class="summary-item"><span>${escapeHtml(l.name)} (${escapeHtml(l.color)} / ${escapeHtml(l.size)}) × ${l.qty}</span><span>${won(l.total)}</span></div>`).join('')}
            <div class="summary-item" style="border-top:1px solid var(--line);padding-top:10px;margin-top:10px"><span>배송비</span><span>${order.shippingFee ? won(order.shippingFee) : '무료'}</span></div>
            <div class="summary-item"><strong>총 결제 금액</strong><strong>${won(order.total)}</strong></div>
            <div class="summary-item"><span>결제 수단</span><span>${PAY_LABEL[order.pay] || ''}</span></div>
          </div>

          <div class="complete-box">
            <h2>배송지</h2>
            <p>${escapeHtml(s.name)} · ${escapeHtml(s.phone)}</p>
            <p>(${escapeHtml(s.zip)}) ${escapeHtml(s.addr1)} ${escapeHtml(s.addr2)}</p>
            ${s.memo ? `<p style="color:var(--text-sub)">${escapeHtml(s.memo)}</p>` : ''}
          </div>

          <div class="complete-actions">
            <a href="shop.html" class="btn btn-light">쇼핑 계속하기</a>
            <a href="index.html" class="btn btn-dark">홈으로</a>
          </div>
        </div>`;
    }
  </script>
</body>
</html>
