<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>상품 상세 | LEQI</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
  <header id="site-header"></header>

  <main class="container" id="main"></main>

  <footer id="site-footer"></footer>

  <script src="assets/js/data.js"></script>
  <script src="assets/js/store.js"></script>
  <script>
    const product = findProduct(getParam('id'));
    const main = $('#main');

    const SIZE_TABLE = {
      top: { head: ['사이즈', '어깨', '가슴', '소매', '총장'], rows: { S: [48, 56, 21, 68], M: [50, 58, 22, 70], L: [52, 60, 23, 72], XL: [54, 62, 24, 74] } },
      outer: { head: ['사이즈', '어깨', '가슴', '소매', '총장'], rows: { S: [46, 58, 60, 100], M: [48, 60, 61, 103], L: [50, 62, 62, 106], XL: [52, 64, 63, 108] } },
      bottom: { head: ['사이즈', '허리', '엉덩이', '허벅지', '총장'], rows: { S: [34, 50, 32, 100], M: [36, 52, 33, 101], L: [38, 54, 34, 102], XL: [40, 56, 35, 103] } },
      dress: { head: ['사이즈', '어깨', '가슴', '허리', '총장'], rows: { S: [36, 44, 34, 118], M: [37, 46, 36, 120], L: [38, 48, 38, 122] } },
    };

    function sizeTableHtml(p) {
      const t = SIZE_TABLE[p.category];
      if (!t) return `<p>${escapeHtml(p.fit)}</p>`;
      const rows = p.sizes.filter((s) => t.rows[s])
        .map((s) => `<tr><th>${s}</th>${t.rows[s].map((v) => `<td>${v}</td>`).join('')}</tr>`).join('');
      return `<table class="size-table"><thead><tr>${t.head.map((h) => `<th>${h}</th>`).join('')}</tr></thead><tbody>${rows}</tbody></table>
              <p style="margin-top:8px;font-size:12px;color:var(--text-sub)">단위: cm · 측정 방법에 따라 1–3cm 오차가 있을 수 있습니다.</p>`;
    }

    if (!product) {
      main.innerHTML = `<div class="empty"><p>상품을 찾을 수 없습니다.</p><a href="shop.html" class="btn btn-light">쇼핑 계속하기</a></div>`;
    } else {
      document.title = `${product.name} | ${SHOP.name}`;
      const state = { color: product.colors[0], size: product.sizes.length === 1 ? product.sizes[0] : null, qty: 1 };

      main.innerHTML = `
        <nav class="breadcrumb"><a href="index.html">홈</a> / <a href="shop.html?cat=${product.category}">${categoryLabel(product.category)}</a> / ${escapeHtml(product.name)}</nav>
        <div class="pdp">
          <div class="pdp-img" id="pdp-img"></div>
          <div class="pdp-info">
            <div class="pdp-cat">${SHOP.name} · ${categoryLabel(product.category)}</div>
            <h1>${escapeHtml(product.name)}</h1>
            ${priceHtml(product)}
            <p class="ship-note">배송비 ${won(SHOP.shippingFee)} (${won(SHOP.freeShippingMin)} 이상 무료) · 제주/도서산간 추가 배송비 발생</p>

            <div class="opt">
              <div class="opt-label">색상 <span id="color-name"></span></div>
              <div class="color-opts" id="color-opts">
                ${product.colors.map((c, i) => `<button class="color-opt" style="background:${c.hex}" data-i="${i}" aria-label="${c.name}" title="${c.name}"></button>`).join('')}
              </div>
            </div>

            <div class="opt">
              <div class="opt-label">사이즈</div>
              <div class="size-opts" id="size-opts">
                ${product.sizes.map((s) => `<button class="size-opt" data-size="${s}">${s}</button>`).join('')}
              </div>
              <p class="opt-error" id="size-error" hidden>사이즈를 선택해 주세요.</p>
            </div>

            <div class="opt">
              <div class="opt-label">수량</div>
              <div class="qty">
                <button type="button" data-d="-1" aria-label="수량 감소">−</button>
                <input type="number" id="qty" value="1" min="1" max="99" aria-label="수량">
                <button type="button" data-d="1" aria-label="수량 증가">+</button>
              </div>
            </div>

            <div class="pdp-total"><span>총 상품 금액</span><strong id="total"></strong></div>
            <div class="pdp-actions">
              <button class="btn btn-light" id="add-cart">장바구니</button>
              <button class="btn btn-dark" id="buy-now">바로 구매</button>
            </div>

            <div class="accordion">
              <details open><summary>상품 정보</summary><div class="acc-body">
                <p>${escapeHtml(product.desc)}</p>
                <ul style="margin-top:10px"><li>소재: ${escapeHtml(product.material)}</li><li>핏: ${escapeHtml(product.fit)}</li><li>제조국: 대한민국</li></ul>
              </div></details>
              <details><summary>사이즈 가이드</summary><div class="acc-body">${sizeTableHtml(product)}</div></details>
              <details><summary>배송 · 교환 · 반품</summary><div class="acc-body"><ul>
                <li>평일 오후 2시 이전 결제 완료 시 당일 출고 (주말·공휴일 제외)</li>
                <li>배송 기간: 출고 후 1–3 영업일</li>
                <li>상품 수령 후 7일 이내 교환·반품 신청 가능</li>
                <li>단순 변심에 의한 교환·반품 시 왕복 배송비 ${won(SHOP.shippingFee * 2)} 고객 부담</li>
                <li>착용 흔적, 세탁, 택 제거 시 교환·반품이 불가합니다.</li>
              </ul><p style="margin-top:8px"><a href="policy.html#shipping" style="text-decoration:underline">자세히 보기</a></p></div></details>
            </div>
          </div>
        </div>
        <section class="related">
          <div class="section-head"><h2 style="font-size:22px">함께 보면 좋은 상품</h2></div>
          <div class="grid">${PRODUCTS.filter((p) => p.category === product.category && p.id !== product.id)
            .concat(PRODUCTS.filter((p) => p.category !== product.category && p.isBest))
            .slice(0, 4).map(productCard).join('')}</div>
        </section>`;

      function update() {
        $('#pdp-img').innerHTML = productImage(product, state.color.hex);
        $('#color-name').textContent = state.color.name;
        $$('.color-opt').forEach((b) => b.classList.toggle('active', product.colors[b.dataset.i] === state.color));
        $$('.size-opt').forEach((b) => b.classList.toggle('active', b.dataset.size === state.size));
        $('#qty').value = state.qty;
        $('#total').textContent = won(finalPrice(product) * state.qty);
      }

      $('#color-opts').addEventListener('click', (e) => {
        const b = e.target.closest('.color-opt');
        if (b) { state.color = product.colors[b.dataset.i]; update(); }
      });
      $('#size-opts').addEventListener('click', (e) => {
        const b = e.target.closest('.size-opt');
        if (b) { state.size = b.dataset.size; $('#size-error').hidden = true; update(); }
      });
      $$('.qty button').forEach((b) => b.addEventListener('click', () => {
        state.qty = Math.max(1, Math.min(99, state.qty + Number(b.dataset.d))); update();
      }));
      $('#qty').addEventListener('change', (e) => {
        state.qty = Math.max(1, Math.min(99, parseInt(e.target.value, 10) || 1)); update();
      });

      function addToCart() {
        if (!state.size) { $('#size-error').hidden = false; return false; }
        Cart.add({ id: product.id, color: state.color.name, size: state.size, qty: state.qty });
        return true;
      }
      $('#add-cart').addEventListener('click', () => {
        if (addToCart()) toast('장바구니에 담았습니다.', { href: 'cart.html', text: '바로가기' });
      });
      $('#buy-now').addEventListener('click', () => {
        if (addToCart()) location.href = 'checkout.html';
      });

      update();
    }
  </script>
</body>
</html>
