<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>주문/결제 | LEQI</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
  <header id="site-header"></header>

  <main class="container">
    <div class="page-title"><h1>주문/결제</h1></div>

    <form id="order-form" class="cart-layout" novalidate>
      <div>
        <section class="form-section">
          <h2>주문자 정보</h2>
          <div class="field-row">
            <div class="field"><label for="buyer-name">이름<span class="req">*</span></label><input class="input" id="buyer-name" name="buyerName" autocomplete="name" required></div>
            <div class="field"><label for="buyer-phone">휴대폰 번호<span class="req">*</span></label><input class="input" id="buyer-phone" name="buyerPhone" type="tel" inputmode="numeric" placeholder="010-0000-0000" autocomplete="tel" required></div>
          </div>
          <div class="field"><label for="buyer-email">이메일<span class="req">*</span></label><input class="input" id="buyer-email" name="buyerEmail" type="email" placeholder="주문 내역을 보내드립니다" autocomplete="email" required></div>
        </section>

        <section class="form-section">
          <h2>배송지 정보</h2>
          <label class="check" style="margin-bottom:16px"><input type="checkbox" id="same-as-buyer" checked> 주문자 정보와 동일</label>
          <div class="field-row">
            <div class="field"><label for="recv-name">받는 분<span class="req">*</span></label><input class="input" id="recv-name" name="recvName" required></div>
            <div class="field"><label for="recv-phone">연락처<span class="req">*</span></label><input class="input" id="recv-phone" name="recvPhone" type="tel" inputmode="numeric" placeholder="010-0000-0000" required></div>
          </div>
          <div class="field">
            <label for="zip">주소<span class="req">*</span></label>
            <div class="zip-row">
              <input class="input" id="zip" name="zip" placeholder="우편번호" inputmode="numeric" required>
              <button type="button" class="btn btn-light" id="find-addr">주소 검색</button>
            </div>
            <input class="input" id="addr1" name="addr1" placeholder="기본 주소" required style="margin-bottom:8px">
            <input class="input" id="addr2" name="addr2" placeholder="상세 주소 (동/호수 등)">
          </div>
          <div class="field">
            <label for="memo">배송 메모</label>
            <select id="memo" name="memo">
              <option value="">선택 안 함</option>
              <option>문 앞에 놓아주세요</option>
              <option>경비실에 맡겨주세요</option>
              <option>배송 전 연락 부탁드립니다</option>
              <option>택배함에 넣어주세요</option>
            </select>
          </div>
        </section>

        <section class="form-section">
          <h2>결제 수단</h2>
          <div class="pay-opts">
            <label class="pay-opt"><input type="radio" name="pay" value="card" checked><span>신용/체크카드</span></label>
            <label class="pay-opt"><input type="radio" name="pay" value="kakaopay"><span>카카오페이</span></label>
            <label class="pay-opt"><input type="radio" name="pay" value="naverpay"><span>네이버페이</span></label>
            <label class="pay-opt"><input type="radio" name="pay" value="tosspay"><span>토스페이</span></label>
            <label class="pay-opt"><input type="radio" name="pay" value="bank"><span>무통장입금</span></label>
            <label class="pay-opt"><input type="radio" name="pay" value="vbank"><span>가상계좌</span></label>
          </div>
          <div class="bank-info" id="bank-info" hidden>
            입금 계좌: <strong id="bank-text"></strong><br>
            주문 후 24시간 이내 미입금 시 자동 취소됩니다.
          </div>
        </section>
      </div>

      <aside class="summary">
        <h2>주문 상품</h2>
        <div class="summary-items" id="summary-items"></div>
        <div class="summary-row"><span>상품 금액</span><span id="s-subtotal"></span></div>
        <div class="summary-row"><span>배송비</span><span id="s-shipping"></span></div>
        <div class="summary-total"><span>최종 결제 금액</span><strong id="s-total"></strong></div>
        <div class="agree-box">
          <label class="check"><input type="checkbox" id="agree" required> 주문 내용 확인 및 결제 동의 (필수)</label>
          <p>개인정보 수집·이용 및 제3자 제공(배송업체), <a href="policy.html#terms" target="_blank" style="text-decoration:underline">이용약관</a>, <a href="policy.html#privacy" target="_blank" style="text-decoration:underline">개인정보처리방침</a>에 동의합니다.</p>
          <p class="form-error" id="form-error" hidden></p>
        </div>
        <button type="submit" class="btn btn-dark btn-block" id="pay-btn"></button>
        <p class="demo-note">※ 현재 데모 모드입니다. 실제 결제는 이루어지지 않습니다.</p>
      </aside>
    </form>
  </main>

  <footer id="site-footer"></footer>

  <script src="assets/js/data.js"></script>
  <script src="assets/js/store.js"></script>
  <script>
    const cart = Cart.detail();
    if (!cart.lines.length) location.replace('cart.html');

    const form = $('#order-form');
    $('#summary-items').innerHTML = cart.lines.map((l) =>
      `<div class="summary-item"><span>${escapeHtml(l.product.name)}<br><small>${escapeHtml(l.color)} / ${escapeHtml(l.size)} · ${l.qty}개</small></span><span>${won(l.total)}</span></div>`).join('');
    $('#s-subtotal').textContent = won(cart.subtotal);
    $('#s-shipping').textContent = cart.shipping ? won(cart.shipping) : '무료';
    $('#s-total').textContent = won(cart.total);
    $('#pay-btn').textContent = `${won(cart.total)} 결제하기`;
    $('#bank-text').textContent = SHOP.bank;

    // 휴대폰 번호 자동 하이픈
    const formatPhone = (v) => {
      const d = v.replace(/\D/g, '').slice(0, 11);
      if (d.length < 4) return d;
      if (d.length < 8) return `${d.slice(0, 3)}-${d.slice(3)}`;
      return d.length === 11 ? `${d.slice(0, 3)}-${d.slice(3, 7)}-${d.slice(7)}` : `${d.slice(0, 3)}-${d.slice(3, 6)}-${d.slice(6)}`;
    };
    $$('input[type=tel]').forEach((el) => el.addEventListener('input', () => { el.value = formatPhone(el.value); syncReceiver(); }));

    // 배송지 = 주문자 정보
    function syncReceiver() {
      if (!$('#same-as-buyer').checked) return;
      $('#recv-name').value = $('#buyer-name').value;
      $('#recv-phone').value = $('#buyer-phone').value;
    }
    $('#buyer-name').addEventListener('input', syncReceiver);
    $('#same-as-buyer').addEventListener('change', syncReceiver);

    // 결제 수단
    form.addEventListener('change', (e) => {
      if (e.target.name === 'pay') $('#bank-info').hidden = e.target.value !== 'bank';
    });

    // 주소 검색 (카카오 우편번호 서비스 — 무료, 별도 키 불필요)
    function openPostcode() {
      new daum.Postcode({
        oncomplete(data) {
          $('#zip').value = data.zonecode;
          $('#addr1').value = data.roadAddress || data.jibunAddress;
          $('#addr2').focus();
        },
      }).open();
    }
    $('#find-addr').addEventListener('click', () => {
      if (window.daum && daum.Postcode) return openPostcode();
      const s = document.createElement('script');
      s.src = 'https://t1.daumcdn.net/mapjsapi/bundle/postcode/prod/postcode.v2.js';
      s.onload = openPostcode;
      s.onerror = () => alert('주소 검색을 불러오지 못했습니다. 주소를 직접 입력해 주세요.');
      document.head.appendChild(s);
    });

    // 검증 & 주문
    const RULES = {
      buyerName: (v) => v.trim().length >= 2,
      buyerPhone: (v) => /^01[016789]-?\d{3,4}-?\d{4}$/.test(v),
      buyerEmail: (v) => /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v),
      recvName: (v) => v.trim().length >= 2,
      recvPhone: (v) => /^01[016789]-?\d{3,4}-?\d{4}$/.test(v),
      zip: (v) => /^\d{5}$/.test(v),
      addr1: (v) => v.trim().length > 3,
    };

    form.addEventListener('submit', (e) => {
      e.preventDefault();
      syncReceiver();
      let firstBad = null;
      for (const [name, ok] of Object.entries(RULES)) {
        const el = form.elements[name];
        const valid = ok(el.value);
        el.classList.toggle('invalid', !valid);
        if (!valid && !firstBad) firstBad = el;
      }
      const err = $('#form-error');
      if (firstBad) {
        err.textContent = '입력 정보를 확인해 주세요. (휴대폰 번호, 이메일, 우편번호 5자리 등)';
        err.hidden = false;
        firstBad.focus();
        return;
      }
      if (!$('#agree').checked) {
        err.textContent = '주문 동의에 체크해 주세요.';
        err.hidden = false;
        return;
      }
      err.hidden = true;

      // ▼ 실제 운영 시: 여기서 PG사(토스페이먼츠 등) 결제창을 호출하고,
      //   서버에서 결제 승인 후 주문을 저장해야 합니다. (README 참고)
      const now = new Date();
      const ymd = now.toISOString().slice(0, 10).replace(/-/g, '');
      const order = {
        orderNo: `${ymd}-${String(Math.floor(Math.random() * 1e6)).padStart(6, '0')}`,
        createdAt: now.toISOString(),
        buyer: { name: form.buyerName.value, phone: form.buyerPhone.value, email: form.buyerEmail.value },
        shipping: {
          name: form.recvName.value, phone: form.recvPhone.value,
          zip: form.zip.value, addr1: form.addr1.value, addr2: form.addr2.value, memo: form.memo.value,
        },
        pay: form.pay.value,
        lines: cart.lines.map((l) => ({ name: l.product.name, color: l.color, size: l.size, qty: l.qty, total: l.total })),
        subtotal: cart.subtotal, shippingFee: cart.shipping, total: cart.total,
      };
      storage.set('leqi_last_order', order);
      Cart.clear();
      location.href = 'order-complete.html';
    });
  </script>
</body>
</html>
